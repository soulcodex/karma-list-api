[project]
name = "karma-list-api"
version = "0.1.0"
description = "Workshop companion service for a small Karma List API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pylint>=3.3,<4",
  "pyright>=1.1,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karma_list"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.design]
max-module-lines = 250
